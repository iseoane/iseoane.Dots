add_newline = true
# Keep the existing fast command timeout; allow enough time for directory scans.
command_timeout = 200
scan_timeout = 120
format = "[$directory$git_branch$git_status]($style)$character"

# Tokyo Night system palette. The fuchsia accent mirrors the active window border.
palette = "xeoTheme"

[palettes.xeoTheme]
black = "#0E0E14"
red = "#F7768E"
green = "#9ECE6A"
yellow = "#E0AF68"
blue = "#7AA2F7"
purple = "#AD8EE6"
cyan = "#449DAB"
white = "#A9B1D6"
bright-black = "#565F89"
bright-red = "#FF7A93"
bright-green = "#B9F27C"
bright-yellow = "#FF9E64"
bright-blue = "#7DA6FF"
bright-purple = "#BB9AF7"
bright-cyan = "#0DB9D7"
bright-white = "#C0CAF5"
background = "#1A1B26"
accent = "#FF2E9A"
orange = "#EB927B"
soft-purple = "#AD8EE6"
lavender = "#BB9AF7"
muted = "#414868"
selection = "#292E42"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
