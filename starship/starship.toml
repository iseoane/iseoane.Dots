# Starship prompt configuration.
# Shared across zsh (Debian/WSL) and PowerShell 7 (Windows) — see the init lines
# in zsh/.zshrc and powershell/Microsoft.PowerShell_profile.ps1.

# Raised from the 30ms default: on Windows the directory scan competes with
# Sophos File Scanner (on-access AV) and Device Encryption on every file read.
# The Z: drive is a virtual FAT32 filesystem served by GoogleDriveFS (a
# user-mode driver, slower than kernel NTFS), so scanning folders there is far
# slower than a real local disk. 60ms still tripped the warning on Z:; 120ms
# absorbs the GoogleDriveFS + Sophos latency.
scan_timeout = 120
add_newline = true
format = "[$directory$git_branch$git_status]($style)$character"

# git status shells out; give it more room under the same AV/encryption overhead
# than the 500ms default before it too times out silently.
command_timeout = 1000

# ── Color theme ──────────────────────────────────────────────────────────
# xeoTheme mirrors the Tokyo Night system palette; accent is the fuchsia active-window border.
# The entries deliberately reuse Starship's *standard* color names. A palette
# entry shadows the built-in color of the same name, so the default prompt
# (which styles its modules as "bold green", "bold cyan", ...) picks the theme
# up without rewriting a single module. Verified on starship 1.26.0.
# Comment this out to fall back to the terminal's own 16 ANSI colors.
palette = "xeoTheme"

[palettes.xeoTheme]
black = "#0E0E14"
red = "#F7768E"
green = "#9ECE6A"
yellow = "#E0AF68"
blue = "#7AA2F7"
purple = "#AD8EE6"
cyan = "#449DAB"
white = "#A9B1D6"
bright-black = "#565F89"
bright-red = "#FF7A93"
bright-green = "#B9F27C"
bright-yellow = "#FF9E64"
bright-blue = "#7DA6FF"
bright-purple = "#BB9AF7"
bright-cyan = "#0DB9D7"
bright-white = "#C0CAF5"
background = "#1A1B26"
accent = "#FF2E9A"
orange = "#EB927B"
soft-purple = "#AD8EE6"
lavender = "#BB9AF7"
muted = "#414868"
selection = "#292E42"

# Compact, git-focused prompt layout.
[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format = "[$all_status]($style)"
style = "cyan"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""
