onboarding = false
# herdr configuration managed by Gentleman.Dots.
# This file is copied into ~/.config/herdr/config.toml during installation.
# Shared across Debian/WSL and Windows.

[update]
channel = "stable"

[theme]
# Use a built-in dark theme with neutral foregrounds so Herdr does not inherit
# Ghostty bright-black selected rows or Kanagawa's warm/yellow label text.
# The Gentleman preset below only overrides individual tokens on top of this
# base, so the base still supplies every colour it does not name. one-dark is
# what Gentleman.Dots pairs the preset with; catppuccin was the previous choice
# here.
#
# Built-in themes (herdr 0.8.2): catppuccin, catppuccin-latte, terminal,
# tokyo-night, tokyo-night-day, dracula, nord, gruvbox, gruvbox-light,
# one-dark, one-light, solarized, solarized-light, kanagawa, kanagawa-lotus,
# rose-pine, rose-pine-dawn, vesper. Herdr has no user-defined named themes,
# so a custom palette can only be expressed as [theme.custom] overrides.
name = "one-dark"

auto_switch = false

# ── Colour preset: GENTLEMAN (ACTIVE) ────────────────────────────
# The palette gentle-ai injects into its agents, matching wezterm's
# "Gentleman Blur" scheme and the gentleman-blur Starship palette.
# Values copied verbatim from Gentleman.Dots' own herdr/config.toml; the
# canonical palette lives in Gentleman-Programming/gentleman-kanagawa-blur
# (lua/gentleman_kanagawa_blur/variant.lua, palette `blur`).
#
# `accent` and `blue` are #6FA0AF, the muted cyan upstream picked here rather
# than the brighter #7FB4CA that ghostty exports. Upstream's own comment on
# that line reads: "Match Pi's Gentle theme, with a muted cyan for Herdr
# chrome." This is no longer a herdr-only value: since Gentleman.Dots' fish
# config defines no blue at all, #6FA0AF is now the blue across wezterm,
# Windows Terminal, Starship and nvim's :terminal too.
#
# Other tokens [theme.custom] accepts, if the chrome ever needs more grounding:
# base, text, subtext0, surface0/1/2, overlay0/1, teal, peach, lavender,
# sidebar_bg, active_row_bg, selection_bg. Left unset on purpose: upstream
# pairs exactly these six with the one-dark base, and the result is not
# verifiable from here without looking at a running Herdr.
[theme.custom]
panel_bg = "#06080f"
accent = "#6FA0AF"
green = "#B7CC85"
blue = "#6FA0AF"
red = "#CB7C94"
yellow = "#DEBA87"

# CATPPUCCIN MOCHA preset (to switch back: set name = "catppuccin" above,
# comment out the [theme.custom] block and the [ui] accent line below).
# herdr chrome then follows the built-in catppuccin (mocha) theme, no overrides.

[ui]
accent = "#6FA0AF"  # GENTLEMAN preset only
prompt_new_tab_name = false
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
pane_gaps = false
copy_on_select = true

[ui.sidebar.agents]
row_gap = 0
rows = [
   ["state_icon", "workspace"],
   ["terminal_title_stripped"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
   ["state_icon", "workspace"],
   ["branch", "git_status"],
]

[ui.toast.clipboard]
enabled=false

[keys]
# Match tmux/Zellij-style prefix muscle memory.
prefix = "ctrl+a"

# Move between agents in the sidebar.
# Avoid Herdr's built-in prefix+shift+j/k pane-swap bindings.
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# Jump straight to agent N (1..9) as listed in the sidebar.
# Use Ctrl after the prefix: Alt+number is owned by skhd/yabai spaces,
# and Shift+number did not reach Herdr reliably in the current terminal setup.
focus_agent = "prefix+ctrl+1..9"

# Open the herdr-file-viewer split pane (git-aware file browser).
# Windows-specific action (PowerShell). On Linux/macOS the plugin exposes
# "herdr-file-viewer.open-file-viewer" instead, so this binding only works on
# the Windows side where the plugin is installed.
[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-windows"
description = "file-viewer: open"

# Toggle the reviewr code-review sidebar (diffs + line comments + PR tab).
# Its default binding is cmd+r (macOS only), so we bind our own here.
[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle review sidebar"

# Open the focused pane's branch PR in the browser (gh-pr).
# The sidebar PR-status label updates automatically on pane focus / worktree open.
[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "gh-pr.open-pr"
description = "gh-pr: open PR in browser"

[keys.indexed]
workspaces = "ctrl"
agents = "ctrl+shift"

[ui.toast]
delivery = "herdr"

[ui.sound]
# Play herdr's built-in sounds on agent state changes. `enabled` turns sound
# on; a sound fires when an agent finishes (done) or becomes blocked / needs
# input (request). Set done_path/request_path to your own mp3s to override.
# Works on both Windows and Debian/WSL (played by the local herdr client).
enabled = true

[ui.sound.agents]
claude = "on"

# ── WINDOWS ONLY — uncomment after copying this file to %APPDATA%\herdr ──
# Without this, herdr panes on Windows spawn Windows PowerShell 5.1 (no
# Starship, no PSReadLine predictions, no profile shims). PS7 is installed
# from the MSI package (machine PATH, stable install dir); the full path keeps
# pane spawning independent of the server's inherited PATH. Do NOT enable on
# Debian/WSL: the path doesn't exist there and panes would fail to spawn
# ($SHELL/zsh is already the default).
# [terminal]
# default_shell = 'C:\Program Files\PowerShell\7\pwsh.exe'
